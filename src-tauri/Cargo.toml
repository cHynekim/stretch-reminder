[package]
name = "stretch-reminder"
version = "0.1.0"
description = "Reminds you to stretch, and makes sure you actually do it"
edition = "2021"

[lib]
name = "stretch_reminder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
