<!doctype html>
<html lang="en" class="toast-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time to Stretch!!</title>
  </head>
  <body class="toast">
    <div class="toast-card" id="card">
      <div class="lifetime" aria-hidden="true"><span id="lifetime-bar"></span></div>
      <header class="toast-head" data-i18n-title="toast.open">
        <i class="sprite" data-sprite="blob" data-px="3"></i>
        <h1 id="toast-title">Time to Stretch!!</h1>
        <p class="toast-sub" id="toast-sub" role="status"></p>
      </header>

      <ul class="toast-list" id="list"></ul>

      <button type="button" class="btn wide" id="complete">Complete</button>
    </div>
    <script type="module" src="/src/toast.ts"></script>
  </body>
</html>
