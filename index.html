<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stretch Reminder</title>
  </head>
  <body class="settings">
    <main class="wrap">
      <header class="hero">
        <!-- Start-screen motif: dotted circles filling in a loop (setup screens only) -->
        <div class="motif" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1 id="title"></h1>
        <p id="subtitle" class="muted"></p>
      </header>

      <!-- 1. Details (only after setup) -->
      <section class="card" id="details" hidden>
        <div class="card-head">
          <h2 data-i18n="details"></h2>
          <span class="muted small" id="today"></span>
        </div>
        <div class="countdown">
          <span class="muted small" data-i18n="stat.next"></span>
          <span class="countdown-num" id="countdown">--:--:--</span>
        </div>
        <p class="legend small">
          <span><i class="mini done"></i><span id="legend-done"></span></span>
          <span><i class="mini missed"></i><span id="legend-missed"></span></span>
          <span><i class="mini"></i><span id="legend-goal"></span></span>
        </p>
      </section>

      <!-- 2. Body parts -->
      <section class="card" id="parts-card">
        <div class="card-head">
          <h2 data-i18n="bodyParts"></h2>
          <div class="row-actions">
            <button type="button" id="select-all" class="link" data-i18n="selectAll"></button>
            <button type="button" id="select-none" class="link danger" data-i18n="clear"></button>
          </div>
          <!-- Start screen only: replaces Select all / Clear -->
          <p class="parts-guide muted small" data-i18n="parts.guide"></p>
        </div>
        <div id="parts" class="parts-grid"></div>
      </section>

      <!-- 3. Remind me every + today's goal (asked again each new day) -->
      <section class="card">
        <h2 data-i18n="remindEvery"></h2>
        <div class="stepper" data-stepper="interval">
          <button type="button" class="step" data-dir="-1" data-i18n-aria="interval.dec">−</button>
          <output id="interval-value"></output>
          <button type="button" class="step" data-dir="1" data-i18n-aria="interval.inc">+</button>
        </div>

        <h2 class="mt" data-i18n="goal"></h2>
        <div class="stepper" data-stepper="goal">
          <button type="button" class="step" data-dir="-1" data-i18n-aria="goal.dec">−</button>
          <output id="goal-value"></output>
          <button type="button" class="step" data-dir="1" data-i18n-aria="goal.inc">+</button>
        </div>
        <p class="muted small center" id="goal-hint"></p>
      </section>

      <!-- 4. Notification settings (only after setup) -->
      <section class="card" id="advanced" hidden>
        <h2 data-i18n="notification"></h2>
        <p class="label" data-i18n="position"></p>
        <div class="segmented" id="position" role="radiogroup">
          <button type="button" role="radio" data-value="right-top" data-i18n="pos.right-top"></button>
          <button type="button" role="radio" data-value="right-bottom" data-i18n="pos.right-bottom"></button>
          <button type="button" role="radio" data-value="middle" data-i18n="pos.middle"></button>
        </div>

        <p class="label mt" data-i18n="staysFor"></p>
        <div class="stepper" data-stepper="duration">
          <button type="button" class="step" data-dir="-1" data-i18n-aria="duration.dec">−</button>
          <output id="duration-value"></output>
          <button type="button" class="step" data-dir="1" data-i18n-aria="duration.inc">+</button>
        </div>
        <p class="muted small center" data-i18n="duration.hint"></p>
      </section>

      <!-- 5. Language -->
      <section class="card" id="language-card">
        <h2>Language · 언어</h2>
        <div class="segmented two" id="language" role="radiogroup" aria-label="Language">
          <button type="button" role="radio" data-value="en" lang="en">English</button>
          <button type="button" role="radio" data-value="ko" lang="ko">한국어</button>
        </div>
      </section>

      <footer class="actions">
        <div class="footer-left">
          <button type="button" id="quit" class="btn ghost-danger" data-i18n="quit" hidden></button>
          <button type="button" id="community" class="link" data-i18n="community" hidden></button>
        </div>
        <div class="buttons">
          <button type="button" id="test" class="btn secondary" data-i18n="test" hidden></button>
          <button type="button" id="save" class="btn primary"></button>
        </div>
      </footer>
      <p id="message" class="message" role="status"></p>
      <p id="app-version" class="app-version muted small"></p>
    </main>

    <!-- Backdrop behind the update toast on the start screens -->
    <div id="update-backdrop" class="update-backdrop" hidden></div>

    <!-- In-app toast: a new version is available (top of the window, or centred on start screens) -->
    <div id="update-toast" class="app-toast top" role="status" aria-live="polite" hidden>
      <button type="button" id="update-close" class="toast-x" data-i18n-aria="update.close">×</button>
      <p id="update-title" class="update-title"></p>
      <p id="update-body" class="muted small"></p>
      <div id="update-actions" class="app-toast-actions">
        <button type="button" id="update-skip" class="link" data-i18n="update.skip"></button>
        <button type="button" id="update-later" class="btn secondary" data-i18n="update.later"></button>
        <button type="button" id="update-now" class="btn primary" data-i18n="update.now"></button>
      </div>
      <p id="update-status" class="small" hidden></p>
      <div id="update-error" hidden>
        <p class="small error-text" data-i18n="update.failed"></p>
        <div class="app-toast-actions">
          <button type="button" id="update-site" class="btn primary" data-i18n="update.openSite"></button>
        </div>
      </div>
    </div>

    <!-- In-app confirmation toast for quitting -->
    <div id="quit-toast" class="app-toast" role="alertdialog" aria-labelledby="quit-toast-text" hidden>
      <p id="quit-toast-text" data-i18n="quit.confirm"></p>
      <div class="app-toast-actions">
        <button type="button" id="quit-cancel" class="btn secondary" data-i18n="quit.cancel"></button>
        <button type="button" id="quit-confirm" class="btn danger" data-i18n="quit.yes"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
